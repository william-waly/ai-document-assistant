name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this pipeline only needs to read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now pointless, run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # The tests need a REAL PostgreSQL with pgvector, not a mock.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/docai_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12" # same as the Docker image
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff, including security rules)
        run: ruff check app tests alembic

      # Fails the pipeline if any test fails, or coverage drops below 90 %.
      - name: Run tests
        run: pytest --cov --cov-fail-under=90

  frontend:
    name: Frontend - type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  audit:
    name: Dependency vulnerability scan (does not block)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # New CVEs appear without any change in our code, so a finding here is a
    # warning to act on, not a reason to fail every unrelated pull request.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Node dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  docker:
    name: Docker - build and smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The example file contains only placeholders, which is exactly what CI needs.
      - name: Create .env from the example
        run: cp .env.example .env

      - name: Validate the compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.prod.yml config -q

      - name: Build and start the production stack
        run: docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 240

      - name: Smoke test
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS -o /dev/null http://localhost:5173/
          # -D - prints the response headers of a normal GET (HEAD is not allowed on /health)
          curl -fsS -D - -o /dev/null http://localhost:5173/ | grep -i "content-security-policy"
          curl -fsS -D - -o /dev/null http://localhost:8000/health | grep -i "x-content-type-options"

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color --tail 100

      - name: Clean up
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
