[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
# E/F: errors and unused code, I: import order, B: likely bugs,
# S: security (bandit): SQL injection, hardcoded secrets, unsafe calls, UP: modern syntax
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["E501"]  # line length is the formatter's job

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: `x = Depends(...)` in a default argument.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and fixed, throwaway test passwords.
"tests/*" = ["S101", "S105", "S106", "S107", "S311"]
# Alembic migrations hold fixed DDL strings.
"alembic/*" = ["S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
